<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ role|title }} Login - CertChain</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background: linear-gradient(
                135deg,
                #06162b,
                #0b3d91,
                #0288d1
            );
            color: white;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.11);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.35);
        }

        .logo {
            margin-bottom: 25px;
            text-align: center;
            font-size: 30px;
            font-weight: bold;
        }

        .logo span {
            color: #4fc3f7;
        }

        .role-icon {
            margin-bottom: 10px;
            text-align: center;
            font-size: 55px;
        }

        h1 {
            margin-bottom: 8px;
            text-align: center;
            font-size: 30px;
        }

        .subtitle {
            margin-bottom: 30px;
            text-align: center;
            color: #d5e9ff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 9px;
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 15px;
        }

        input::placeholder {
            color: #c7ddf7;
        }

        input:focus {
            border-color: #4fc3f7;
            background: rgba(255, 255, 255, 0.18);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #29b6f6;
            color: #06162b;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: white;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #d7ecff;
            text-decoration: none;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            Cert<span>Chain</span>
        </div>

        <div class="role-icon">
            {% if role == "admin" %}
                👨‍💼
            {% elif role == "student" %}
                🎓
            {% else %}
                🏢
            {% endif %}
        </div>

        <h1>{{ role|title }} Login</h1>

        <p class="subtitle">
            Enter your credentials to continue
        </p>

        <form method="POST">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                Login as {{ role|title }}
            </button>

        </form>

        <a class="back-link" href="/">
            ← Back to Home
        </a>

    </div>

</body>
</html>
