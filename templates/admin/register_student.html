<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register Student - CertChain</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            min-height: 100vh;
            background: #f2f6fb;
        }

        .topbar {
            padding: 18px 6%;
            background: linear-gradient(135deg, #061a33, #0b4380);
            color: white;
        }

        .brand {
            color: white;
            font-size: 27px;
            font-weight: bold;
            text-decoration: none;
        }

        .brand span {
            color: #42c8ff;
        }

        .form-card {
            max-width: 950px;
            margin: 45px auto;
            padding: 35px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 15px 40px rgba(21, 51, 82, 0.12);
        }

        .form-control,
        .form-select {
            min-height: 48px;
        }

        .section-icon {
            display: grid;
            width: 55px;
            height: 55px;
            place-items: center;
            border-radius: 14px;
            background: #e4f5ff;
            color: #0878c7;
            font-size: 25px;
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="d-flex justify-content-between align-items-center">

            <a href="/admin/dashboard" class="brand">
                Cert<span>Chain</span>
            </a>

            <a
                href="/admin/dashboard"
                class="btn btn-outline-light"
            >
                <i class="bi bi-arrow-left"></i>
                Dashboard
            </a>

        </div>
    </header>

    <main class="container">

        <div class="form-card">

            <div class="d-flex gap-3 align-items-center mb-4">

                <div class="section-icon">
                    <i class="bi bi-person-plus-fill"></i>
                </div>

                <div>
                    <h2 class="fw-bold mb-1">
                        Register Student
                    </h2>

                    <p class="text-muted mb-0">
                        Create a student profile and login account
                    </p>
                </div>

            </div>

            {% with messages =
                get_flashed_messages(with_categories=true)
            %}

                {% if messages %}
                    {% for category, message in messages %}

                        <div
                            class="alert alert-{{ category }}
                                   alert-dismissible fade show"
                        >
                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                            ></button>
                        </div>

                    {% endfor %}
                {% endif %}

            {% endwith %}

            <form method="POST">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Student ID
                        </label>

                        <input
                            type="text"
                            name="student_id"
                            class="form-control"
                            placeholder="Example: CSE2026001"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            placeholder="Enter student full name"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="student@example.com"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Phone Number
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            placeholder="Enter phone number"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Course
                        </label>

                        <input
                            type="text"
                            name="course"
                            class="form-control"
                            placeholder="Example: Diploma / B.Tech"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Department
                        </label>

                        <input
                            type="text"
                            name="department"
                            class="form-control"
                            placeholder="Example: Computer Engineering"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Academic Year
                        </label>

                        <input
                            type="text"
                            name="academic_year"
                            class="form-control"
                            placeholder="Example: 2025-2026"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Login Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Create student password"
                            minlength="6"
                            required
                        >
                    </div>

                </div>

                <div class="d-flex gap-3 mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary px-4"
                    >
                        <i class="bi bi-person-check-fill"></i>
                        Register Student
                    </button>

                    <a
                        href="/admin/students"
                        class="btn btn-outline-secondary px-4"
                    >
                        View Students
                    </a>

                </div>

            </form>

        </div>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
